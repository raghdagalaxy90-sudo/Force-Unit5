<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forces Quest</title>
<meta name="description" content="Dr. Raghda's Class — Unit 5 Forces review game with teacher dashboard">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Cairo:wght@500;700&display=swap">
<style>
/* Layout: index-card deck — one lesson-tinted card at a time, pastel tabs per lesson (TPK12–16). */
:root{
  --bg:#fbf7f2; --surface:#ffffff; --surface2:#f6f1fb; --ink:#3b3651; --muted:#7a7393; --line:#ebe4f3;
  --primary:#7d63cc; --primary-ink:#ffffff; --primary-soft:#ece5fb;
  --ok:#2f9e6e; --ok-soft:#ddf5e9; --bad:#d65a78; --bad-soft:#fde3ea; --gold:#e9b949;
  --lav:#d9ccf7; --lav-s:#f3eefd; --sky:#c3e2f7; --sky-s:#eaf5fd; --peach:#ffd6bf; --peach-s:#fff1e8;
  --mint:#bfead6; --mint-s:#e8f8f0; --pink:#f8c6d8; --pink-s:#fdedf3; --lemon:#fbeaa8; --lemon-s:#fff9e2;
  --shadow:0 1px 2px rgba(59,54,81,.06),0 8px 24px rgba(125,99,204,.08);
  --f-display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --f-ar:"Cairo","Segoe UI",Tahoma,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1d1b27; --surface:#272434; --surface2:#2f2b3f; --ink:#f1edfb; --muted:#aba4c4; --line:#3b3650;
  --primary:#b49cf5; --primary-ink:#1d1b27; --primary-soft:#3a3157;
  --ok:#7fd8ad; --ok-soft:#21392f; --bad:#f39ab0; --bad-soft:#43262f; --gold:#f2cf6e;
  --lav:#6e5fa3; --lav-s:#2f2a45; --sky:#4f7a99; --sky-s:#243341; --peach:#a3735a; --peach-s:#3a2c25;
  --mint:#4f8f74; --mint-s:#22352d; --pink:#a3607a; --pink-s:#3a2630; --lemon:#9a8645; --lemon-s:#353020;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d1b27; --surface:#272434; --surface2:#2f2b3f; --ink:#f1edfb; --muted:#aba4c4; --line:#3b3650;
  --primary:#b49cf5; --primary-ink:#1d1b27; --primary-soft:#3a3157;
  --ok:#7fd8ad; --ok-soft:#21392f; --bad:#f39ab0; --bad-soft:#43262f; --gold:#f2cf6e;
  --lav:#6e5fa3; --lav-s:#2f2a45; --sky:#4f7a99; --sky-s:#243341; --peach:#a3735a; --peach-s:#3a2c25;
  --mint:#4f8f74; --mint-s:#22352d; --pink:#a3607a; --pink-s:#3a2630; --lemon:#9a8645; --lemon-s:#353020;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);padding-inline:16px;padding-block:0 48px;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto}
.wide{max-width:1160px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
.ar{font-family:var(--f-ar);direction:rtl}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.top .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1160px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:conic-gradient(from 200deg,var(--lav),var(--sky),var(--mint),var(--lemon),var(--peach),var(--pink),var(--lav));display:grid;place-items:center;font:700 18px var(--f-display);color:#3b3651;flex:none}
.brand b{font:600 17px var(--f-display);display:block}
.brand small{color:var(--muted);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:700}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{padding:7px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:700;font-size:14px}
nav.tabs a[aria-current="page"]{background:var(--primary-soft);color:var(--ink)}
nav.tabs a:hover{color:var(--ink)}

/* generic */
.view{padding-top:22px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:800;background:var(--primary);color:var(--primary-ink);transition:transform .12s, filter .12s}
.btn:hover{filter:brightness(1.05)} .btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.small{padding:8px 14px;font-size:14px;border-radius:12px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field{display:grid;gap:6px}
.field input,.field select{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;width:100%}
.field input:focus,.field select:focus{border-color:var(--primary);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
.stack{display:grid;gap:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid transparent;border-radius:14px;padding:9px 13px;font-weight:700;font-size:14.5px;background:var(--surface2);display:flex;align-items:center;gap:8px;text-align:left}
.chip .code{font:600 11px var(--f-display);letter-spacing:.06em;opacity:.75}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.t-lav{background:var(--lav-s)} .t-sky{background:var(--sky-s)} .t-peach{background:var(--peach-s)} .t-mint{background:var(--mint-s)} .t-pink{background:var(--pink-s)}
.d-lav{background:var(--lav)} .d-sky{background:var(--sky)} .d-peach{background:var(--peach)} .d-mint{background:var(--mint)} .d-pink{background:var(--pink)} .d-lemon{background:var(--lemon)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.notice{border-radius:14px;padding:10px 14px;font-size:14px;background:var(--lemon-s)}

/* home hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:start}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(30px,5vw,44px);font-weight:700}
.hero h1 span{background:linear-gradient(transparent 62%,var(--lemon) 62%)}
.rules{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:12px;align-items:flex-start;font-size:14.5px}
.rules .pt{font:600 13px var(--f-display);min-width:52px;text-align:center;border-radius:10px;padding:4px 6px;flex:none}
.deck{position:relative;height:150px;margin-top:6px}
.deck div{position:absolute;inset:auto;width:70%;height:110px;border-radius:16px;box-shadow:var(--shadow);padding:14px;font:600 14px var(--f-display);color:#3b3651}
.deck div:nth-child(1){left:0;top:30px;transform:rotate(-6deg)}
.deck div:nth-child(2){left:12%;top:16px;transform:rotate(-1deg)}
.deck div:nth-child(3){left:26%;top:4px;transform:rotate(5deg)}
@media (max-width:760px){.deck{display:none}}

/* quiz */
.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.pill{background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px;box-shadow:var(--shadow);display:flex;gap:6px;align-items:center}
.pill .k{color:var(--muted);font-weight:700}
.streak-on{background:var(--peach-s)}
.progress{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--lav),var(--sky),var(--mint));border-radius:999px;transition:width .35s}
.qcard{border-radius:24px;padding:24px;box-shadow:var(--shadow);position:relative}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{font:600 12px var(--f-display);letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--surface);color:var(--ink)}
.qtext{font:500 clamp(19px,2.6vw,23px)/1.45 var(--f-display);margin:0 0 18px}
.qtext mark{background:var(--bad-soft);color:var(--bad);padding:0 4px;border-radius:6px;text-decoration:line-through wavy;text-decoration-thickness:1px}
.qhint{font-size:14px;color:var(--muted);margin:-8px 0 14px}
.opts{display:grid;gap:10px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:13px 16px;text-align:left;font-weight:700;display:flex;gap:12px;align-items:center;min-height:54px;transition:border-color .15s, transform .12s}
.opt:hover:not([disabled]){border-color:var(--primary);transform:translateY(-1px)}
.opt .key{font:600 13px var(--f-display);width:28px;height:28px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;flex:none}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.gone{opacity:.25}
.opt[disabled]{cursor:default}
.tf .opt{justify-content:center;font:600 20px var(--f-display);min-height:72px}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numrow input{flex:1 1 160px;min-width:0;border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-weight:800;font-size:18px;background:var(--surface)}
.numrow .unit{font:600 18px var(--f-display)}
.fb{margin-top:16px;border-radius:16px;padding:14px 16px;display:grid;gap:4px}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--bad-soft)}
.fb b{font-family:var(--f-display);font-weight:600;font-size:18px}
.qfoot{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.pop{animation:pop .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.shake{animation:shake .35s}

/* result */
.res-top{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
@media (max-width:600px){.res-top{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{--p:0;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--primary) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center}
.ring b{font:700 34px var(--f-display);display:block;line-height:1}
.badge{display:inline-flex;gap:8px;align-items:center;font:600 15px var(--f-display);padding:6px 14px;border-radius:999px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 52px;gap:10px;align-items:center;font-size:14px}
.bar .tr{height:14px;background:var(--surface2);border-radius:999px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:999px}
.bar .v{text-align:right;font-weight:800}
@media (max-width:520px){.bar{grid-template-columns:1fr 46px}.bar .tr{grid-column:1/-1;grid-row:2}}
.tip{border-radius:16px;padding:16px;background:var(--lemon-s);display:grid;gap:6px}
.review{display:grid;gap:10px}
.rv{border-radius:14px;padding:12px 14px;background:var(--surface2);display:grid;gap:4px;font-size:14.5px}
.rv .a{color:var(--ok);font-weight:800}
.rv .y{color:var(--bad);font-weight:700}

/* study */
.flip{perspective:1000px;cursor:pointer;border:0;padding:0;background:none;width:100%;text-align:left}
.flip .in{position:relative;min-height:230px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;padding:24px;display:grid;align-content:center;gap:10px;box-shadow:var(--shadow)}
.flip .b{transform:rotateY(180deg);background:var(--surface)}
.flip .f h3{font-size:22px}
@media (prefers-reduced-motion:reduce){.flip .in{transition:none}*{animation:none!important}}
.formula{display:grid;gap:10px}
.formula div{border-radius:14px;padding:14px 16px;display:grid;gap:2px}
.formula code{font:600 17px var(--f-display);white-space:normal}

/* leaderboard */
.lb{display:grid;gap:8px}
.lb .r{display:grid;grid-template-columns:40px 1fr auto auto;gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow)}
.lb .rk{font:700 18px var(--f-display);text-align:center}
.lb .r:nth-child(1) .rk{color:var(--gold)}

/* teacher */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{border-radius:16px;padding:14px 16px;display:grid;gap:2px}
.kpi b{font:700 28px var(--f-display)}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.panels{grid-template-columns:1fr}}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.toolbar .field{flex:1 1 180px}
.tbl{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:760px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface2);cursor:pointer;user-select:none}
tr:last-child td{border-bottom:0}
.sc{display:inline-block;min-width:52px;text-align:center;border-radius:999px;padding:2px 10px;font-weight:800}
.g-a{background:var(--ok-soft);color:var(--ok)} .g-b{background:var(--sky-s)} .g-c{background:var(--lemon-s)} .g-d{background:var(--bad-soft);color:var(--bad)}
.minis{display:flex;gap:3px}
.minis i{width:16px;height:16px;border-radius:5px;display:block}
.hard{display:grid;gap:8px;font-size:14px}
.hard div{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start}
.iconbtn{border:0;background:none;color:var(--muted);padding:4px 8px;border-radius:8px}
.iconbtn:hover{background:var(--bad-soft);color:var(--bad)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.login{max-width:420px;margin:30px auto}
.qrbox{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.qr{background:#ffffff;border-radius:14px;padding:10px;width:132px;height:132px;flex:none}
.qr svg{display:block;width:100%;height:100%}
.qrlink{font-size:13px;word-break:break-all;color:var(--muted)}
.qrbig{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;align-content:center;gap:18px;padding:24px;text-align:center}
.qrbig .qr{width:min(70vmin,520px);height:min(70vmin,520px);padding:22px;box-shadow:var(--shadow)}
.qrbig h2{font-size:clamp(26px,4vw,44px)}
@media (max-width:420px){.qrbox{grid-template-columns:1fr;justify-items:start}}
footer{margin-top:36px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <div class="brand">
      <div class="logo" aria-hidden="true">F</div>
      <div><b>Forces Quest</b><small>Dr. Raghda's Class · Unit 5</small></div>
    </div>
    <nav class="tabs" aria-label="Main">
      <a href="#home" data-nav="home">Play</a>
      <a href="#study" data-nav="study">Study cards</a>
      <a href="#formulas" data-nav="formulas">Formulas</a>
      <a href="#board" data-nav="board">Top 10</a>
      <a href="#teacher" data-nav="teacher" id="navTeacher">Teacher</a>
    </nav>
  </div>
</header>

<main id="app" class="wrap"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<footer>Forces Quest · Dr. Raghda's Class · Unit 5 (TPK12–TPK16)</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
/* =====================================================================
   Dr. Raghda's Class — Unit 5 Question Bank (Forces)
   Source: QB_Unit_5.docx  (TPK12 → TPK16)

   HOW TO EDIT
   - tf   : [statement, true/false, explanation]
   - mcq  : [question, [A,B,C,D], correctIndex(0-3), explanation]   (options keep their order)
   - term / comp / fix / prob : same as mcq but options are SHUFFLED for the student,
            so you can always put the correct answer first (index 0).
   - fix  : wrap the wrong word(s) in [[ ]] — it is highlighted for the student.
   - num  : [question, correctNumber, unit, explanation, tolerance(optional, 0.02 = ±2%)]
   - cards: [question, model answer]  (study cards, not scored)
   ===================================================================== */

window.LESSONS = {
  L12: { code: 'TPK12', name: 'Force & Its Units', tone: 'lav', formula: 'F = m · a   |   1 N = 1 kg·m/s²' },
  L13: { code: 'TPK13', name: 'Gravitational Force', tone: 'sky', formula: 'F = G · m₁m₂ / r²   |   G = 6.67 × 10⁻¹¹ N·m²/kg²' },
  L14: { code: 'TPK14', name: 'Centripetal Force', tone: 'peach', formula: 'F = m · v² / r   |   a = v² / r' },
  L15: { code: 'TPK15', name: 'Friction Force', tone: 'mint', formula: 'Static > Sliding > Rolling (strength of friction)' },
  L16: { code: 'TPK16', name: 'Viscosity', tone: 'pink', formula: 'F = η · A · v / d   |   η in N·s/m² = Pa·s' }
};

window.QB = {
  /* ------------------------------------------------------------ TPK12 */
  L12: {
    tf: [
      ["Newton's second law can be written as the equation a = F/m.", true, 'F = m·a, so a = F/m.'],
      ['Force and acceleration are scalar quantities.', false, 'Both have magnitude AND direction, so they are vector quantities.'],
      ['Acceleration is a change in velocity caused by an unbalanced force.', true, 'An unbalanced (net) force changes velocity, which is acceleration.'],
      ['When no resultant force affects the object, it does not move with acceleration.', true, 'Zero net force means a = 0: the object stays at rest or keeps a constant velocity.'],
      ['Frictional force is an example of a contact force.', true, 'Friction needs the two surfaces to touch.'],
      ['Force always causes motion in the object.', false, 'A force can be balanced, or change only the shape of an object (e.g. pushing a wall).'],
      ['Contact forces do not require physical interaction.', false, 'Contact forces need physical contact between the objects.'],
      ['When the interaction vanishes, there is no force between the two objects.', true, 'Force exists only as a result of interaction.'],
      ['The net force on an object moving at constant velocity is zero.', true, 'Constant velocity means a = 0, so ΣF = m·a = 0.'],
      ['The formula for force is F = m·a.', true, "Newton's second law."]
    ],
    fix: [
      ['Force is a [[scalar]] quantity.', ['vector', 'basic', 'energy', 'fixed'], 0, 'Force has magnitude and direction.'],
      ['Friction is a [[non-contact]] force.', ['contact', 'magnetic', 'gravitational', 'field'], 0, 'Friction acts only where surfaces touch.'],
      ['Newton equals 1 [[kg/m²]].', ['kg·m/s²', 'kg·m/s', 'kg/s²', 'J/s'], 0, 'F = m·a → kg × m/s² = kg·m/s².'],
      ['Magnetic force is an example of a [[contact]] force.', ['non-contact', 'frictional', 'normal', 'tension'], 0, 'Magnets act at a distance.'],
      ['Force [[can exist without]] interaction between objects.', ['only exists as a result of', 'is stronger without', 'has no relation to', 'is weaker with'], 0, 'No interaction → no force.'],
      ['The SI unit of force is the [[joule]].', ['newton', 'watt', 'pascal', 'kilogram'], 0, 'The joule is the unit of energy/work.'],
      ['Air resistance is a [[non-contact]] force.', ['contact', 'magnetic', 'gravitational', 'electric'], 0, 'Air particles touch the moving object.'],

<script>
(function(){
'use strict';
const LESSONS = window.LESSONS, QB = window.QB;
const LKEYS = Object.keys(LESSONS);
const KIND_LABEL = {tf:'True or False', mcq:'Choose', term:'Scientific term', comp:'Complete', fix:'Correct the mistake', prob:'Problem', num:'Solve'};
const SHUFFLE_KINDS = ['term','comp','fix','prob'];
const LOCAL_PASS_HASH = '5bdfaccd9ab7fdf44d2f96bdcfd1b667ea9420946615dfc9f9926e54c79e1e88';
async function sha256(t){ try{ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }catch(e){ return ''; } }
const PASS_MARK = 50;

/* ---------- build bank ---------- */
let BANK = [], CARDS = [];
LKEYS.forEach(L => {
  const g = QB[L] || {};
  Object.keys(g).forEach(kind => {
    if (kind === 'cards') { g.cards.forEach((c,i)=>CARDS.push({id:`${L}-card-${i+1}`, L, q:c[0], a:c[1]})); return; }
    g[kind].forEach((q,i) => {
      const id = `${L}-${kind}-${i+1}`;
      if (kind === 'tf') BANK.push({id,L,kind,t:q[0],a:q[1],ex:q[2]||''});
      else if (kind === 'num') BANK.push({id,L,kind,t:q[0],a:q[1],u:q[2],ex:q[3]||'',tol:q[4]||0.02,abs:q[5]==='abs'});
      else BANK.push({id,L,kind,t:q[0],o:q[1],a:q[2],ex:q[3]||''});
    });
  });
});
const BY_ID = {};
function rebuildIndexes(){
  Object.keys(BY_ID).forEach(k=>delete BY_ID[k]);
  BANK.forEach(q=>BY_ID[q.id]=q);
}
function normalizeQuestion(q){
  const x={...q};
  x.id=String(x.id||('custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)));
  x.L=LKEYS.includes(x.L)?x.L:'L12';
  x.kind=KIND_LABEL[x.kind]?x.kind:'mcq';
  x.t=String(x.t||''); x.ex=String(x.ex||'');
  if(x.kind==='tf'){ x.a=!!x.a; }
  else if(x.kind==='num'){ x.a=Number(x.a); x.u=String(x.u||''); x.tol=Number.isFinite(Number(x.tol))?Number(x.tol):0.02; x.abs=!!x.abs; }
  else { x.o=Array.isArray(x.o)?x.o.map(String):['','','','']; while(x.o.length<4)x.o.push(''); x.o=x.o.slice(0,4); x.a=Math.max(0,Math.min(3,Number(x.a)||0)); }
  return x;
}
function applyBankPayload(payload){
  if(!payload || !Array.isArray(payload.questions)) return false;
  const qs=payload.questions.map(normalizeQuestion).filter(q=>q.t);
  const cards=Array.isArray(payload.cards)?payload.cards:[];
  BANK.length=0; qs.forEach(q=>BANK.push(q));
  CARDS.length=0; cards.forEach((c,i)=>CARDS.push({id:c.id||`custom-card-${i+1}`,L:c.L||'L12',q:String(c.q||''),a:String(c.a||'')}));
  rebuildIndexes();
  return true;
}


/* ---------- helpers ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const fmtTime = s => `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
const fmtDate = iso => { try{ return new Date(iso).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; } };
const qText = t => esc(t).replace(/\[\[(.+?)\]\]/g,'<mark>$1</mark>');
const plain = t => String(t).replace(/\[\[(.+?)\]\]/g,'$1');
const grade = p => p>=85?['g-a','Gold']:p>=65?['g-b','Silver']:p>=PASS_MARK?['g-c','Bronze']:['g-d','Keep going'];
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }
const ls = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } } };
const memStore = {};
function localGet(k){ const v = ls.get(k,null); return v!==null ? v : (memStore[k]||[]); }
function localSet(k,v){ memStore[k]=v; ls.set(k,v); }

/* ---------- storage (cloud via /api, fallback local) ---------- */
const RKEY='fq-u5-results', PKEY='fq-u5-pending';
async function timedFetch(url,opt={},ms=6000){ const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms); try{ return await fetch(url,{...opt,signal:c.signal,cache:'no-store'}); } finally{ clearTimeout(t); } }
const Store = {
  mode:'checking',
  ready:null,
  init(){ return this.ready = this.ready || (async()=>{
    try{ const r=await timedFetch('/api/results?ping=1',{},4000); const ct=r.headers.get('content-type')||''; if(r.ok && ct.includes('json')){ const j=await r.json(); if(j.storage){ this.mode='cloud'; this.flush(); return; } } }catch(e){}
    this.mode='local';
  })(); },
  async flush(){ const p=localGet(PKEY); if(!p.length) return; const left=[]; for(const rec of p){ try{ const r=await timedFetch('/api/results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)}); if(!r.ok) left.push(rec); }catch(e){ left.push(rec); } } localSet(PKEY,left); },
  async save(rec){ await this.init();
    if(this.mode==='cloud'){ try{ const r=await timedFetch('/api/results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)}); if(r.ok) return 'cloud'; }catch(e){} localSet(PKEY,[...localGet(PKEY),rec]); return 'pending'; }
    localSet(RKEY,[rec,...localGet(RKEY)]); return 'local'; },
  async all(pass){ await this.init();
    if(this.mode==='cloud'){ const r=await timedFetch('/api/results',{headers:{'x-teacher-pass':pass}}); if(r.status===401) throw new Error('auth'); if(r.status===503) throw new Error('nopass'); if(!r.ok) throw new Error('net'); return (await r.json()).results||[]; }
    if((await sha256(pass))!==LOCAL_PASS_HASH) throw new Error('auth'); return localGet(RKEY); },
  async del(pass,id){ if(this.mode==='cloud'){ const r=await timedFetch('/api/results'+(id?'?id='+encodeURIComponent(id):''),{method:'DELETE',headers:{'x-teacher-pass':pass}}); if(!r.ok) throw new Error('net'); return; }
    localSet(RKEY, id ? localGet(RKEY).filter(x=>x.id!==id) : []); },
  async board(){ await this.init();
    if(this.mode==='cloud'){ try{ const r=await timedFetch('/api/results?leaderboard=1'); if(r.ok) return (await r.json()).board||[]; }catch(e){} return []; }
    const best={}; localGet(RKEY).forEach(r=>{ const k=(r.name+'|'+r.cls).toLowerCase(); const c=best[k]; if(!c||r.pct>c.pct||(r.pct===c.pct&&r.points>c.points)) best[k]=r; });
    return Object.values(best).sort((a,b)=>b.pct-a.pct||b.points-a.points||a.secs-b.secs).slice(0,10); }
};
const QuestionStore = {
  mode:'checking', ready:null,
  init(){ return this.ready=this.ready||(async()=>{
    try{
      const r=await timedFetch('/api/questions',{},5000);
      const ct=r.headers.get('content-type')||'';
      if(r.ok && ct.includes('json')){ const j=await r.json(); if(j.storage){ this.mode='cloud'; if(j.questions) applyBankPayload(j); return; } if(j.questions) applyBankPayload(j); }
    }catch(e){}
    const local=ls.get('fq-u5-question-bank',null); if(local) applyBankPayload(local); this.mode='local';
  })(); },
  async save(pass){
    const payload={questions:BANK,cards:CARDS};
    localSet('fq-u5-question-bank',payload);
    await this.init();
    if(this.mode==='cloud'){
      try{ const r=await timedFetch('/api/questions',{method:'PUT',headers:{'Content-Type':'application/json','x-teacher-pass':pass},body:JSON.stringify(payload)},7000); if(r.ok) return 'cloud'; if(r.status===401) throw new Error('auth'); }
      catch(e){ if(e.message==='auth') throw e; }
    }
    return 'local';
  }
};

Store.init(); QuestionStore.init().then(()=>{ try{ route(); }catch(e){} });

let teacherPass = (()=>{ try{ return sessionStorage.getItem('fq-tp')||''; }catch(e){ return ''; } })();

function qrSVG(text){
  if(typeof window.qrcode!=='function') return '';
  const q=window.qrcode(0,'M'); q.addData(text); q.make();
  const n=q.getModuleCount(), m=2, size=n+m*2; let d='';

function showBigQR(){

}
function route(){

    const name=$('#fName').value.trim(), cls=$('#fCls').value.trim();
    const lessons=[...chips.querySelectorAll('[aria-pressed="true"]')].map(b=>b.dataset.l);
    const lenB=lens.querySelector('[aria-pressed="true"]'); const len=lenB?lenB.dataset.n:20;
    if(!name){ $('#fName').focus(); $('#fName').classList.add('shake'); setTimeout(()=>$('#fName').classList.remove('shake'),400); toast('Write your name first'); return; }
    if(!lessons.length){ toast('Pick at least one lesson'); return; }
    Object.assign(me,{name,cls,lessons,len}); ls.set('fq-me',me);
    startQuiz(pickQuestions(lessons, len==='all'?9999:+len), 'quiz');
  });
}

function pickQuestions(lessons,n){
  // balanced round-robin across lessons, mixed question types
  const pools = lessons.map(L=>shuffle(BANK.filter(q=>q.L===L)));
  const out=[]; let i=0;
  while(out.length<n && pools.some(p=>p.length)){ const p=pools[i%pools.length]; if(p.length) out.push(p.pop()); i++; }
  return shuffle(out);
}

function prep(q){
  const item={q, picked:null, ok:null, hint:false, hidden:[]};
  if(q.o){ const idx=q.o.map((_,i)=>i); item.order = SHUFFLE_KINDS.includes(q.kind) ? shuffle(idx) : idx; }
  return item;
}

function startQuiz(list,mode){
  S = {mode, items:list.map(prep), i:0, points:0, streak:0, best:0, start:Date.now(), qStart:Date.now(), timer:null};
  go('quiz');
}

/* ---------- QUIZ ---------- */
function renderQuiz(){

  let body='';
  if(q.kind==='tf'){
    body = `<div class="opts tf">${[true,false].map(v=>`<button class="opt" data-v="${v}" ${answered?'disabled':''}>${v?'True':'False'}</button>`).join('')}</div>`;

  $('#app').innerHTML = `
  <section class="view">
    <div class="hud">

      ${S.mode==='retry'?'<span class="pill" style="background:var(--lemon-s)">Practice: your mistakes</span>':''}
    </div>

      ${q.kind==='fix'?'<p class="qhint">Choose the word that replaces the highlighted mistake.</p>':''}
      ${q.kind==='term'?'<p class="qhint">Which scientific term matches this description?</p>':''}
      ${it.hint&&q.kind==='num'?`<p class="qhint"><b>Formula hint:</b> ${esc(L.formula)}</p>`:''}

        <div style="display:flex;gap:8px">
          <button class="btn ghost small" id="quitBtn">Finish now</button>

        </div>
      </div>
    </article>

function parseNum(raw){ let s=String(raw).replace(/,/g,'.').replace(/[×x]\s*10\^?/i,'e').replace(/\s+/g,''); const n=parseFloat(s); return Number.isFinite(n)?n:NaN; }
function isRight(q,v){
  if(q.kind==='tf') return v===q.a;
  if(q.kind==='num'){ let n=parseNum(v); if(isNaN(n)) return false; if(q.abs) n=Math.abs(n); return Math.abs(n-q.a) <= Math.max(Math.abs(q.a)*q.tol, 0.005); }
  return v===q.a;
}
function answer(v){
  const it=S.items[S.i]; if(it.picked!==null) return;
  it.picked=v; it.ok=isRight(it.q,v);
  const secs=(Date.now()-S.qStart)/1000;
  let gain=0;
  if(it.ok){ S.streak++; S.best=Math.max(S.best,S.streak); gain=10+(S.streak>=3?5:0)+(secs<15?3:0); }
  else S.streak=0;
  if(it.hint) gain-=3;
  it.gain=gain; S.points=Math.max(0,S.points+gain);
  renderQuiz();
  const card=$('#qcard'); card.classList.add(it.ok?'pop':'shake');
  if(it.ok && gain>10) toast(`+${gain} points${S.streak>=3?' · streak '+S.streak:''}`);
}
function markOptions(it){
  const q=it.q;
  document.querySelectorAll('.opt').forEach(b=>{
    const v = q.kind==='tf' ? b.dataset.v==='true' : +b.dataset.v;
    if(v===q.a) b.classList.add('correct');
    else if(v===it.picked) b.classList.add('wrong');
    b.disabled=true;
  });
}
function correctText(q){ if(q.kind==='tf') return q.a?'True':'False'; if(q.kind==='num') return `${q.a} ${q.u}`; return q.o[q.a]; }
function feedbackHTML(it){
  const q=it.q;
  return `<div class="fb ${it.ok?'ok':'no'}" role="status"><b>${it.ok?'Correct!':'Not quite.'}${it.ok&&it.gain?` +${it.gain}`:''}</b>
    ${it.ok?'':`<span>Correct answer: <strong>${esc(correctText(q))}</strong>${q.kind==='num'?` (you wrote ${esc(it.picked)})`:''}</span>`}
    ${q.ex?`<span>${esc(q.ex)}</span>`:''}</div>`;
}
function useHint(){
  const it=S.items[S.i], q=it.q; if(it.hint||it.picked!==null) return;
  it.hint=true;
  if(q.o){ const wrong=shuffle(q.o.map((_,i)=>i).filter(i=>i!==q.a)).slice(0,2); it.hidden=wrong; }
  renderQuiz();
}
function next(){ if(S.i<S.items.length-1){ S.i++; S.qStart=Date.now(); renderQuiz(); } else finish(); }

async function finish(){
  clearInterval(S.timer);
  const done=S.items.filter(it=>it.picked!==null);
  if(!done.length){ S=null; go('home'); return; }
  const per={}; done.forEach(it=>{ const p=per[it.q.L]||(per[it.q.L]=[0,0]); p[1]++; if(it.ok) p[0]++; });
  const correct=done.filter(it=>it.ok).length;
  const rec={ id:Date.now().toString(36)+Math.random().toString(36).slice(2,7), name:me.name, cls:me.cls, lessons:[...new Set(done.map(it=>it.q.L))].sort(),
    total:done.length, correct, pct:Math.round(correct/done.length*100), points:S.points, secs:Math.round((Date.now()-S.start)/1000),
    perLesson:per, answers:done.map(it=>[it.q.id,it.ok?1:0]), at:new Date().toISOString() };
  lastResult={rec, items:done, mode:S.mode, best:S.best, saved: S.mode==='retry'?'practice':'saving'};
  S=null; go('result');
  if(lastResult.mode!=='retry'){ const r=lastResult; r.saved = await Store.save(rec); if(location.hash==='#result') renderResult(); }
}

  overlay.innerHTML=`<div class="card" style="width:min(900px,96vw);max-height:92vh;overflow:auto"><div class="row" style="justify-content:space-between"><div><p class="label">Teacher Question Editor</p><h2 style="margin:0">${q?'Edit question':'Add question'}</h2></div><button class="btn ghost small" id="qeClose">Close</button></div>
    <div class="grid2" style="margin-top:16px">
      <label class="field"><span class="label">Lesson</span><select id="qeL">${lessons.map(([k,v])=>`<option value="${k}" ${x.L===k?'selected':''}>${esc(v.code)} · ${esc(v.name)}</option>`).join('')}</select></label>
      <label class="field"><span class="label">Question type</span><select id="qeKind"><option value="mcq">Choose</option><option value="tf">True or False</option><option value="num">Solve (number)</option><option value="term">Scientific term</option><option value="comp">Complete</option><option value="fix">Correct the mistake</option><option value="prob">Problem</option></select></label>
    </div>
    <label class="field"><span class="label">Question / statement</span><textarea id="qeT" rows="4">${esc(x.t)}</textarea></label>
    <div id="qeAnswerArea"></div>
    <label class="field"><span class="label">Explanation / solution</span><textarea id="qeEx" rows="3">${esc(x.ex||'')}</textarea></label>
    <div class="row" style="justify-content:flex-end;gap:8px"><button class="btn danger small" id="qeDelete" ${q?'':'hidden'}>Delete</button><button class="btn small" id="qeSave">Save question</button></div>
  </div>`;
  document.body.appendChild(overlay);
  $('#qeKind',overlay).value=x.kind;
  function drawAnswer(){
    const kind=$('#qeKind',overlay).value;
    if(kind==='tf') $('#qeAnswerArea',overlay).innerHTML=`<label class="field"><span class="label">Correct answer</span><select id="qeA"><option value="true" ${x.a===true?'selected':''}>True</option><option value="false" ${x.a===false?'selected':''}>False</option></select></label>`;
    else if(kind==='num') $('#qeAnswerArea',overlay).innerHTML=`<div class="grid2"><label class="field"><span class="label">Correct number</span><input id="qeA" type="number" step="any" value="${esc(x.a)}"></label><label class="field"><span class="label">Unit</span><input id="qeU" value="${esc(x.u||'')}"></label><label class="field"><span class="label">Tolerance (e.g. 0.02 = ±2%)</span><input id="qeTol" type="number" step="0.001" value="${esc(x.tol??0.02)}"></label><label class="field"><span class="label">Compare absolute value?</span><select id="qeAbs"><option value="false" ${!x.abs?'selected':''}>No</option><option value="true" ${x.abs?'selected':''}>Yes</option></select></label></div>`;
    else $('#qeAnswerArea',overlay).innerHTML=`<div class="grid2">${[0,1,2,3].map(i=>`<label class="field"><span class="label">Option ${'ABCD'[i]} ${i===0?'(correct by default for shuffled types)':''}</span><input class="qeOpt" data-i="${i}" value="${esc(options[i]||'')}"></label>`).join('')}</div><label class="field"><span class="label">Correct option</span><select id="qeA">${[0,1,2,3].map(i=>`<option value="${i}" ${Number(x.a)===i?'selected':''}>${'ABCD'[i]}</option>`).join('')}</select></label>`;
  }
  drawAnswer();
  $('#qeKind',overlay).onchange=()=>{ x.kind=$('#qeKind',overlay).value; drawAnswer(); };
  $('#qeClose',overlay).onclick=()=>overlay.remove();
  $('#qeSave',overlay).onclick=async()=>{
    const kind=$('#qeKind',overlay).value; const id=x.id||`custom-${Date.now()}-${Math.random().toString(36).slice(2,7)}`; const nq={id,L:$('#qeL',overlay).value,kind,t:$('#qeT',overlay).value.trim(),ex:$('#qeEx',overlay).value.trim()};
    if(!nq.t){toast('Write the question first');return;}
    if(kind==='tf') nq.a=$('#qeA',overlay).value==='true';
    else if(kind==='num'){ nq.a=Number($('#qeA',overlay).value); nq.u=$('#qeU',overlay).value.trim(); nq.tol=Number($('#qeTol',overlay).value)||0.02; nq.abs=$('#qeAbs',overlay).value==='true'; if(!Number.isFinite(nq.a)){toast('Enter a valid correct number');return;} }
    else { nq.o=[...overlay.querySelectorAll('.qeOpt')].sort((a,b)=>a.dataset.i-b.dataset.i).map(i=>i.value.trim()); nq.a=Number($('#qeA',overlay).value); if(nq.o.some(v=>!v)){toast('Fill all four options');return;} }
    const idx=BANK.findIndex(z=>z.id===id); if(idx>=0) BANK[idx]=normalizeQuestion(nq); else BANK.push(normalizeQuestion(nq)); rebuildIndexes();
    try{ const mode=await QuestionStore.save(teacherPass); toast(mode==='cloud'?'Question saved for all students':'Question saved on this device'); overlay.remove(); renderQuestionBank(); }catch(e){toast(e.message==='auth'?'Teacher password rejected':'Could not save question');}
  };
  $('#qeDelete',overlay).onclick=async()=>{ if(!confirm('Delete this question?')) return; const idx=BANK.findIndex(z=>z.id===x.id); if(idx>=0) BANK.splice(idx,1); rebuildIndexes(); try{await QuestionStore.save(teacherPass);toast('Question deleted');overlay.remove();renderQuestionBank();}catch(e){toast('Could not save deletion');} };
}

function analyse(rows){
  const n=rows.length, students=new Set(rows.map(r=>(r.name+'|'+r.cls).toLowerCase())).size;
  const avg=n?Math.round(rows.reduce((s,r)=>s+r.pct,0)/n):0;
  const top=n?Math.max(...rows.map(r=>r.pct)):0;
  const pass=n?Math.round(rows.filter(r=>r.pct>=PASS_MARK).length/n*100):0;
  const avgTime=n?Math.round(rows.reduce((s,r)=>s+r.secs,0)/n):0;
  const les={}; LKEYS.forEach(L=>les[L]=[0,0]);
  rows.forEach(r=>Object.entries(r.perLesson||{}).forEach(([L,[c,t]])=>{ if(les[L]){ les[L][0]+=c; les[L][1]+=t; } }));
  const qs={}; rows.forEach(r=>(r.answers||[]).forEach(([id,ok])=>{ const x=qs[id]||(qs[id]=[0,0]); x[1]++; if(ok) x[0]++; }));
  const dist=[0,0,0,0]; rows.forEach(r=>dist[r.pct>=85?0:r.pct>=65?1:r.pct>=PASS_MARK?2:3]++);
  return {n,students,avg,top,pass,avgTime,les,qs,dist};
}

function drawDashboard(){
  const classes=[...new Set(T.rows.map(r=>r.cls).filter(Boolean))].sort();
  const view=T.rows.filter(r=>(!T.cls||r.cls===T.cls)&&(!T.q||r.name.toLowerCase().includes(T.q.toLowerCase())));
  const A=analyse(view);
  const sorted=view.slice().sort((a,b)=>{ const k=T.sort; const x=a[k],y=b[k]; return (x>y?1:x<y?-1:0)*T.dir; });
  const hard=Object.entries(A.qs).filter(([id,v])=>BY_ID[id]&&v[1]>=2).map(([id,[c,t]])=>({q:BY_ID[id],p:Math.round(c/t*100),t})).sort((a,b)=>a.p-b.p).slice(0,8);
  const distLabels=[['Gold 85–100','g-a','d-mint'],['Silver 65–84','g-b','d-sky'],['Bronze 50–64','g-c','d-lemon'],['Below 50','g-d','d-pink']];
  const maxD=Math.max(1,...A.dist);
  const th=(k,l)=>`<th data-k="${k}" aria-sort="${T.sort===k?(T.dir>0?'ascending':'descending'):'none'}">${l}${T.sort===k?(T.dir>0?' ↑':' ↓'):''}</th>`;
  $('#app').innerHTML = `
  <section class="view stack">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:end">
      <div><p class="label">Teacher dashboard · Unit 5</p><h2 style="font-size:30px">Dr. Raghda's class results</h2></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn small" id="xls" ${view.length?'':'disabled'}>Download Excel</button>
        <button class="btn small" id="questionBankBtn">Question Bank</button><button class="btn ghost small" id="refresh">Refresh</button>
        <button class="btn ghost small" id="logout">Lock</button>
      </div>
    </div>
    ${Store.mode==='local'?`<p class="notice" style="margin:0">Demo mode: the online database is not connected yet, so you only see results played on this device. After you connect Upstash Redis on Vercel, every student's result appears here.</p>`:''}
    <div class="kpis">
      <div class="kpi t-lav"><span class="label">Attempts</span><b class="num">${A.n}</b></div>
      <div class="kpi t-sky"><span class="label">Students</span><b class="num">${A.students}</b></div>
      <div class="kpi t-mint"><span class="label">Class average</span><b class="num">${A.avg}%</b></div>
      <div class="kpi t-peach"><span class="label">Highest</span><b class="num">${A.top}%</b></div>
      <div class="kpi t-pink"><span class="label">Pass rate (≥${PASS_MARK}%)</span><b class="num">${A.pass}%</b></div>
    </div>
    <div class="panels">
      <div class="card stack">
        <h3>Class mastery by lesson</h3>
        <div class="bars">${LKEYS.map(L=>{ const [c,t]=A.les[L]; const p=t?Math.round(c/t*100):null; return `<div class="bar"><span>${esc(LESSONS[L].name)}</span><span class="tr"><i class="d-${LESSONS[L].tone}" style="width:${p||0}%"></i></span><span class="v num">${p==null?'–':p+'%'}</span></div>`; }).join('')}</div>
        <p class="muted" style="margin:0;font-size:13px">Share of correct answers per lesson across all attempts shown.</p>
      </div>
      <div class="card stack">
        <h3>Grade distribution</h3>
        <div class="bars">${A.dist.map((d,i)=>`<div class="bar"><span><span class="sc ${distLabels[i][1]}" style="min-width:0">${distLabels[i][0]}</span></span><span class="tr"><i class="${distLabels[i][2]}" style="width:${d/maxD*100}%"></i></span><span class="v num">${d}</span></div>`).join('')}</div>
        <p class="muted" style="margin:0;font-size:13px">Average time per attempt: ${fmtTime(A.avgTime)}</p>
      </div>
    </div>
    <div class="card stack">
      <h3>Questions to re-teach</h3>
      ${hard.length?`<div class="hard">${hard.map(h=>`<div><span class="sc ${grade(h.p)[0]} num">${h.p}%</span><span>${esc(plain(h.q.t))} <span class="muted">· ${LESSONS[h.q.L].code}, ${h.t} answers · correct: ${esc(correctText(h.q))}</span></span></div>`).join('')}</div>`:'<p class="muted" style="margin:0">Appears once a question has been answered at least twice.</p>'}
    </div>
    <div class="card stack">
      <div class="toolbar">
        <label class="field"><span class="label">Search student</span><input id="fq" placeholder="Name" value="${esc(T.q)}"></label>
        <label class="field"><span class="label">Class</span><select id="fc"><option value="">All classes</option>${classes.map(c=>`<option ${c===T.cls?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
        <div id="clearBox">${T.confirm==='all'?`<span class="confirm"><span>Delete all ${T.rows.length} results?</span><button class="btn danger small" id="clearYes">Delete all</button><button class="btn ghost small" id="clearNo">Cancel</button></span>`:`<button class="btn danger small" id="clearAll" ${T.rows.length?'':'disabled'}>Clear all results</button>`}</div>
      </div>
      <div class="tbl"><table>
        <thead><tr>${th('name','Student')}${th('cls','Class')}${th('pct','Score')}${th('correct','Correct')}${th('points','Points')}${th('secs','Time')}<th>Lessons</th>${th('at','Date')}<th></th></tr></thead>
        <tbody>${sorted.length?sorted.map(r=>`<tr>
          <td><b>${esc(r.name)}</b></td><td>${esc(r.cls||'–')}</td>
          <td><span class="sc ${grade(r.pct)[0]} num">${r.pct}%</span></td>
          <td class="num">${r.correct}/${r.total}</td><td class="num">${r.points}</td><td class="num">${fmtTime(r.secs)}</td>
          <td><span class="minis">${LKEYS.map(L=>{ const v=(r.perLesson||{})[L]; if(!v) return `<i title="${LESSONS[L].code}: not included" style="background:var(--surface2)"></i>`; const p=Math.round(v[0]/v[1]*100); return `<i title="${LESSONS[L].code}: ${p}%" class="d-${LESSONS[L].tone}" style="opacity:${.25+p/100*.75}"></i>`; }).join('')}</span></td>
          <td class="muted">${esc(fmtDate(r.at))}</td>
          <td>${T.confirm===r.id?`<span class="confirm"><button class="btn danger small" data-del="${esc(r.id)}">Delete</button><button class="btn ghost small" data-cancel="1">Keep</button></span>`:`<button class="iconbtn" data-ask="${esc(r.id)}" aria-label="Delete result of ${esc(r.name)}">Delete</button>`}</td>
        </tr>`).join(''):`<tr><td colspan="9" class="muted" style="text-align:center;padding:28px">No results yet. Share the quiz link with your students; their scores appear here.</td></tr>`}</tbody>
      </table></div>
      <p class="muted" style="margin:0;font-size:13px">Lesson squares: darker = higher score in that lesson. Hover for the exact %.</p>
    </div>
  </section>`;
  $('#fq').oninput=e=>{ T.q=e.target.value; const pos=e.target.selectionStart; drawDashboard(); const f=$('#fq'); f.focus(); f.setSelectionRange(pos,pos); };
  $('#fc').onchange=e=>{ T.cls=e.target.value; drawDashboard(); };
  document.querySelectorAll('th[data-k]').forEach(h=>h.onclick=()=>{ const k=h.dataset.k; if(T.sort===k) T.dir*=-1; else { T.sort=k; T.dir=(k==='name'||k==='cls')?1:-1; } drawDashboard(); });
  $('#questionBankBtn').onclick=renderQuestionBank;
  $('#refresh').onclick=renderTeacher;
  $('#logout').onclick=()=>{ teacherPass=''; try{sessionStorage.removeItem('fq-tp');}catch(_){} renderLogin(); };
  $('#xls').onclick=()=>exportExcel(sorted);
  const ca=$('#clearAll'); if(ca) ca.onclick=()=>{ T.confirm='all'; drawDashboard(); };
  const cn=$('#clearNo'); if(cn) cn.onclick=()=>{ T.confirm=null; drawDashboard(); };
  const cy=$('#clearYes'); if(cy) cy.onclick=async()=>{ try{ await Store.del(teacherPass); T.confirm=null; toast('All results deleted'); renderTeacher(); }catch(e){ toast('Could not delete. Try again.'); } };
  document.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>{ T.confirm=b.dataset.ask; drawDashboard(); });
  document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{ T.confirm=null; drawDashboard(); });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ try{ await Store.del(teacherPass,b.dataset.del); T.rows=T.rows.filter(r=>r.id!==b.dataset.del); T.confirm=null; toast('Result deleted'); drawDashboard(); }catch(e){ toast('Could not delete. Try again.'); } });
}

function exportExcel(rows){
  if(!window.XLSX){ toast('Excel library did not load. Check your connection.'); return; }
  const wb=XLSX.utils.book_new();
  // Sheet 1: all attempts
  const s1=rows.map(r=>{ const o={'Student':r.name,'Class':r.cls||'','Score %':r.pct,'Correct':r.correct,'Questions':r.total,'Points':r.points,'Time (min:sec)':fmtTime(r.secs),'Grade':grade(r.pct)[1]};
    LKEYS.forEach(L=>{ const v=(r.perLesson||{})[L]; o[`${LESSONS[L].code} ${LESSONS[L].name} %`]= v?Math.round(v[0]/v[1]*100):''; });
    o['Date']=new Date(r.at).toLocaleString('en-GB'); return o; });
  const ws1=XLSX.utils.json_to_sheet(s1); ws1['!cols']=Object.keys(s1[0]||{}).map(k=>({wch:Math.max(10,k.length+2)})); ws1['!cols'][0]={wch:24};
  XLSX.utils.book_append_sheet(wb,ws1,'All attempts');
  // Sheet 2: per-student summary
  const st={}; rows.forEach(r=>{ const k=(r.name+'|'+r.cls).toLowerCase(); (st[k]||(st[k]={name:r.name,cls:r.cls,list:[]})).list.push(r); });
  const s2=Object.values(st).map(s=>{ const p=s.list.map(r=>r.pct); return {'Student':s.name,'Class':s.cls||'','Attempts':s.list.length,'Best %':Math.max(...p),'Average %':Math.round(p.reduce((a,b)=>a+b,0)/p.length),'Last %':s.list.slice().sort((a,b)=>a.at<b.at?1:-1)[0].pct,'Best grade':grade(Math.max(...p))[1]}; }).sort((a,b)=>b['Best %']-a['Best %']);
  const ws2=XLSX.utils.json_to_sheet(s2); ws2['!cols']=[{wch:24},{wch:10},{wch:10},{wch:10},{wch:12},{wch:10},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws2,'Students summary');
  // Sheet 3: lessons
  const A=analyse(rows);
  const s3=LKEYS.map(L=>{ const [c,t]=A.les[L]; return {'Code':LESSONS[L].code,'Lesson':LESSONS[L].name,'Answers':t,'Correct':c,'Class mastery %':t?Math.round(c/t*100):''}; });
  const ws3=XLSX.utils.json_to_sheet(s3); ws3['!cols']=[{wch:8},{wch:22},{wch:10},{wch:10},{wch:16}];
  XLSX.utils.book_append_sheet(wb,ws3,'Lesson mastery');
  // Sheet 4: question analysis
  const s4=Object.entries(A.qs).filter(([id])=>BY_ID[id]).map(([id,[c,t]])=>{ const q=BY_ID[id]; return {'Lesson':LESSONS[q.L].code,'Type':KIND_LABEL[q.kind],'Question':plain(q.t),'Correct answer':correctText(q),'Times answered':t,'Correct %':Math.round(c/t*100)}; }).sort((a,b)=>a['Correct %']-b['Correct %']);
  const ws4=XLSX.utils.json_to_sheet(s4.length?s4:[{'Lesson':'','Type':'','Question':'No answers yet','Correct answer':'','Times answered':'','Correct %':''}]); ws4['!cols']=[{wch:8},{wch:18},{wch:70},{wch:28},{wch:14},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws4,'Question analysis');
  const d=new Date(); const stamp=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  try{ XLSX.writeFile(wb,`Dr-Raghda-Unit5-results-${stamp}.xlsx`); toast('Excel file downloaded'); }catch(e){ toast('Download blocked in this preview. It works on the Vercel site.'); }
}

try{ route(); }catch(e){ document.getElementById('app').innerHTML='<p style="padding:24px">Something went wrong while loading the quiz. Refresh the page.</p>'; console.error(e); }
})();
</script>
